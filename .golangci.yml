version: "2"

run:
  timeout: 10m
  modules-download-mode: readonly

linters:
  default: none
  enable:
    # ===== Bug Detection =====
    - errcheck           # Error returns are handled
    - govet              # Official Go vet checks
    - staticcheck        # Comprehensive static analysis
    - ineffassign        # Ineffective assignments
    - unused             # Unused code
    - bodyclose          # HTTP response bodies are closed
    - noctx              # Context usage in HTTP requests
    - nilerr             # nil returned after a non-nil error
    - nilnil             # nil value with a nil error
    - durationcheck      # Duration multiplication bugs
    - makezero           # Slice append after make with length
    - nosprintfhostport  # Sprintf host:port bugs
    - wastedassign       # Wasted assignments

    # ===== Code Style =====
    - misspell           # Spelling
    - unconvert          # Unnecessary type conversions
    - whitespace         # Leading/trailing whitespace in blocks
    - godot              # Comment punctuation
    - perfsprint         # errors.New over verb-less fmt.Errorf

    # ===== Code Quality =====
    - gocritic           # Broad diagnostic/style/performance checks
    - revive             # AI guardrails (see the rule list below)
    - gocyclo            # Cyclomatic complexity
    - gocognit           # Cognitive complexity
    - dupl               # Cross-file copy-paste duplication
    - nakedret           # Naked returns in long functions
    - prealloc           # Slice preallocation
    - predeclared        # Shadowing predeclared identifiers
    - nestif             # Deeply nested ifs
    - goconst            # Repeated strings that should be constants
    - unparam            # Unused parameters
    - errname            # Error naming conventions
    - errorlint          # Error wrapping/comparison bugs
    - wrapcheck          # Errors from other packages are wrapped
    - thelper            # Test helpers call t.Helper()

    # ===== Architecture =====
    - depguard           # Import-boundary / layering enforcement

    # ===== Security =====
    - gosec              # OWASP-style security checks

    # ===== Performance / Modern Go =====
    - copyloopvar
    - modernize

  settings:
    errcheck:
      check-type-assertions: true
      check-blank: false

    govet:
      disable:
        - fieldalignment
        - shadow

    misspell:
      locale: US

    nakedret:
      max-func-lines: 30

    prealloc:
      simple: true
      range-loops: true
      for-loops: true

    # These two numbers are the Go half of a pair: the frontend's eslint config
    # sets `complexity` and `sonarjs/cognitive-complexity` to the same values,
    # so one budget governs both languages.
    gocyclo:
      min-complexity: 10

    gocognit:
      min-complexity: 15

    nestif:
      min-complexity: 5

    # Threshold is in tokens; 150 is upstream's default. CI and `make lint` are
    # patch-scoped, so this gates NEW duplication.
    dupl:
      threshold: 150

    # depguard enforces the layering the Go compiler does not — it only forbids
    # cycles, never direction. The rules below describe m6t's intended shape
    # (DESIGN.md §3.2): main is the composition root, internal/app is the Wails
    # binding leaf that composes the backend services, the services are
    # siblings that talk through declared seams rather than to each other, and
    # buildinfo is a dependency root. list-mode lax = allow everything except
    # what is denied.
    depguard:
      rules:
        # internal/app is the binding layer: it is wired by main and composes
        # the services below it. A service importing it would invert that
        # direction and turn the binding into a shared bus.
        binding-layer-is-not-imported-by-services:
          list-mode: lax
          files:
            - "**/internal/**"
            - "!**/internal/app/**"
            - "!**/*_test.go"
          deny:
            - pkg: github.com/txn2/m6t/internal/app
              desc: "internal/app is the Wails binding layer; it composes services, never the reverse. Invert the dependency behind an interface (see CONTRIBUTING.md)."
        # Backend services (git, pty, kube, helm, …) are siblings. Sibling
        # imports are how a service graph becomes a ball of mud; a service that
        # needs another's behaviour takes an interface from its constructor and
        # lets internal/app wire the two together. buildinfo and gitexec are the
        # exceptions: both are pinned leaves, so depending on either cannot
        # create a cycle or a hidden layer.
        #
        # gitexec was made one in #53. It is the only place a git process is
        # started, and what it holds is not a service's behavior but the
        # conditions every git call must run under — the locale the
        # not-a-repository match depends on, the flag that stops a read
        # rewriting .git/index, the deadlines, git's stderr passed out
        # unedited. A second git reader that imported a sibling to get those
        # would be the ball of mud this rule prevents; one that reimplemented
        # them would be worse, because a wrong answer to any of them fails
        # silently. So the runner sits below every service instead.
        services-do-not-import-each-other:
          list-mode: lax
          files:
            - "**/internal/**"
            - "!**/internal/app/**"
            - "!**/internal/buildinfo/**"
            - "!**/internal/gitexec/**"
            - "!**/*_test.go"
          allow:
            - github.com/txn2/m6t/internal/buildinfo
            - github.com/txn2/m6t/internal/gitexec
          deny:
            - pkg: github.com/txn2/m6t/internal
              desc: "backend services must not import each other; accept an interface and let internal/app wire it (see CONTRIBUTING.md)."
        # buildinfo is a dependency root: link-time identity that any layer can
        # read. One convenience import of a config or service type is all it
        # takes to erode that, so it is pinned here rather than by convention.
        buildinfo-is-a-dependency-root:
          list-mode: lax
          files:
            - "**/internal/buildinfo/**"
            - "!**/*_test.go"
          deny:
            - pkg: github.com/txn2/m6t
              desc: "internal/buildinfo is a leaf with no first-party imports so any layer can use it; keep it that way (see CONTRIBUTING.md)."
        # gitexec is the second dependency root, and it earns the exception for
        # the same reason: a leaf that any layer may use is only safe while it
        # stays a leaf. One import of a project type or a watcher seam and the
        # runner would be pulling half the service graph in behind every git
        # call — including into whatever reads git next, which is the thing #53
        # existed to make possible.
        gitexec-is-a-dependency-root:
          list-mode: lax
          files:
            - "**/internal/gitexec/**"
            - "!**/*_test.go"
          deny:
            - pkg: github.com/txn2/m6t
              desc: "internal/gitexec is a leaf with no first-party imports so any git reader can use it; keep it that way (see CONTRIBUTING.md)."

    gocritic:
      enabled-tags:
        - diagnostic
        - style
        - performance
        - opinionated
      disabled-checks:
        - hugeParam
        - rangeValCopy

    revive:
      severity: error
      confidence: 0.8
      enable-all-rules: false
      rules:
        # ===== Mandatory Style =====
        - name: exported
          severity: error
          arguments: [checkPrivateReceivers, sayRepetitiveInsteadOfStutters]
        - name: package-comments
          severity: error
        - name: var-naming
          severity: error
        - name: receiver-naming
          severity: error
        - name: error-naming
          severity: error
        - name: time-naming
          severity: error
        - name: unexported-naming
          severity: error

        # ===== Error Handling =====
        - name: error-return
          severity: error
        - name: error-strings
          severity: error
        - name: errorf
          severity: error
        - name: unhandled-error
          severity: error
          arguments: ["fmt.Printf", "fmt.Println", "fmt.Print"]

        # ===== Context =====
        - name: context-as-argument
          severity: error
        - name: context-keys-type
          severity: error

        # ===== Imports =====
        - name: blank-imports
          severity: error
        - name: dot-imports
          severity: error
        - name: import-shadowing
          severity: error
        - name: import-alias-naming
          severity: warning
          arguments: ["^[a-z][a-z0-9]*$"]

        # ===== Control Flow =====
        - name: if-return
          severity: warning
        - name: indent-error-flow
          severity: error
        - name: superfluous-else
          severity: warning
        - name: early-return
          severity: warning
        - name: empty-block
          severity: error
        - name: unreachable-code
          severity: error
        - name: unconditional-recursion
          severity: error

        # ===== Function Design (the AI guardrails) =====
        - name: function-result-limit
          severity: warning
          arguments: [3]
        - name: argument-limit
          severity: warning
          arguments: [5]
        - name: cognitive-complexity
          severity: warning
          arguments: [15]
        - name: cyclomatic
          severity: warning
          arguments: [10]
        - name: function-length
          severity: warning
          arguments: [80, 0]
        - name: max-public-structs
          severity: warning
          arguments: [5]

        # ===== Variables =====
        - name: var-declaration
          severity: warning
        - name: increment-decrement
          severity: warning
        - name: range
          severity: warning
        - name: range-val-in-closure
          severity: error
        - name: range-val-address
          severity: error
        - name: redefines-builtin-id
          severity: error
        - name: unused-parameter
          severity: warning
        - name: unused-receiver
          severity: warning
        - name: confusing-naming
          severity: warning
        - name: confusing-results
          severity: warning

        # ===== Safety =====
        - name: bare-return
          severity: warning
        - name: get-return
          severity: warning
        - name: modifies-parameter
          severity: warning
        - name: modifies-value-receiver
          severity: error
        - name: deep-exit
          severity: warning
        - name: defer
          severity: warning
          arguments: [["call-chain", "loop", "method-call", "recover", "immediate-recover", "return"]]

        # ===== Strings =====
        - name: string-of-int
          severity: error
        - name: string-format
          severity: warning
          arguments:
            - - 'fmt.Errorf[0]'
              - '/^[a-z].*[^.]$/'
              - 'error strings should not be capitalized or end with punctuation'

        # ===== Booleans / Types =====
        - name: bool-literal-in-expr
          severity: warning
        - name: constant-logical-expr
          severity: error
        - name: identical-branches
          severity: error
        - name: datarace
          severity: error
        - name: waitgroup-by-value
          severity: error
        - name: atomic
          severity: error

        # ===== Comments =====
        - name: comment-spacings
          severity: warning
          arguments: ["nolint", "TODO", "FIXME", "BUG", "HACK"]

        # ===== Structs / misc =====
        - name: struct-tag
          severity: error
        - name: unexported-return
          severity: warning
        - name: useless-break
          severity: warning
        - name: unnecessary-stmt
          severity: warning
        - name: duplicated-imports
          severity: error

        # ===== Magic values =====
        - name: add-constant
          severity: warning
          arguments:
            - maxLitCount: "3"
              allowStrs: '""'
              allowInts: "0,1,2"
              ignoreFuncs: "make,len,cap"

    gosec:
      config:
        G306: "0644"

    wrapcheck:
      # internal/gitexec's errors are already the finished message: they name
      # the argv that ran — which contains the repository, since git is invoked
      # with -C — and carry git's own stderr verbatim, which DESIGN.md §7
      # requires. internal/git returning one unwrapped is the intended
      # behavior, not a missed wrap; internal/app is what puts the operation's
      # name in front of it, once. Wrapping again in between would turn
      # "pulling in /repo: git -C /repo pull: …" into "pulling in /repo: pull:
      # git -C /repo pull: …".
      #
      # Scoped to that one package. Every other cross-package error still has
      # to be wrapped, which is the rule this exception is measured against.
      ignore-package-globs:
        - github.com/txn2/m6t/internal/gitexec
      ignore-sigs:
        - .Errorf(
        - errors.New(
        - errors.Unwrap(
        - .Wrap(
        - .Wrapf(
        - .WithMessage(
        - .WithStack(

    errorlint:
      errorf: true
      errorf-multi: true
      asserts: true
      comparison: true

    # Scoped to the errorf check: a verb-less fmt.Errorf must be errors.New.
    # The other perfsprint nudges are off to keep the linter targeted.
    perfsprint:
      integer-format: false
      int-conversion: false
      error-format: true
      err-error: false
      errorf: true
      string-format: false
      sprintf1: false
      strconcat: false
      bool-format: false
      hex-format: false

  exclusions:
    generated: lax
    paths:
      # npm dependencies ship Go source. go.mod's `ignore` directive keeps them
      # out of the build; this keeps them out of lint reports too.
      - frontend/node_modules
    rules:
      # Table-driven tests are naturally branchy, repeat fixture blocks, and use
      # literal values — the budgets that keep production code honest punish the
      # standard test shape instead.
      - path: _test\.go
        linters:
          - gocognit
          - gocyclo
          - dupl
          - goconst
      - path: _test\.go
        linters:
          - revive
        text: "cognitive-complexity|cyclomatic|add-constant"
      # Test files legitimately contain hardcoded credentials-shaped fixtures.
      - path: _test\.go
        linters:
          - gosec
        text: "G101"
      # G304 (file inclusion via variable) in tests only. Production code has no
      # exemption: internal/project reads through os.Root with constant
      # filenames, which is the real fix gosec itself recommends and which
      # confines every operation to the config directory. Tests read back files
      # they just wrote into their own t.TempDir(), where there is no path to
      # traverse out of and no input to distrust.
      - path: _test\.go
        linters:
          - gosec
        text: "G304"
      # G302 (file permissions >0600) in tests only, and only for directories
      # restored after a deliberate chmod 0 (internal/watch's fsnotify_test.go
      # and poll_test.go exercise "a directory becomes unreadable mid-walk").
      # A directory needs its execute bit to be usable at all, so nothing
      # gosec would accept here would leave the fixture usable again; the
      # mode is a fixed, owner-only constant, scoped to a path inside the
      # test's own t.TempDir(). Production code never takes this path: it
      # writes only through internal/project's os.Root (configPerm 0600,
      # dirPerm 0700) and internal/watch's own filePerm/dirPerm (0640/0750),
      # neither of which this exemption touches.
      - path: _test\.go
        linters:
          - gosec
        text: "G302"
      # G306 (file permissions >0600 on WriteFile) in tests only, and only for
      # the stub executables that stand in for git, kubectl and helm. A file the
      # package under test is going to exec has to carry its execute bit, so
      # there is no mode gosec would accept that leaves the fixture runnable.
      # The mode is a fixed owner-only constant (0700 — not group- or
      # world-writable) on a path inside the test's own t.TempDir(). Production
      # code takes none of this path: it writes only through internal/project's
      # os.Root (0600/0700) and internal/watch's own 0640/0750, and it never
      # writes an executable at all.
      - path: _test\.go
        linters:
          - gosec
        text: "G306"
      # G204 (subprocess launched with variable) is structurally in conflict
      # with what m6t is. Driving the user's own git, kubectl and helm with
      # arguments built from project paths, branch names and values files is the
      # product, not an accident — .semgrep/go-security.yml says so in its own
      # first rule — so G204 fires on every correct invocation this app will ever
      # make. A gate that fires on the correct pattern trains people to suppress
      # it, which is how the incorrect pattern gets through later.
      #
      # The risk G204 exists to catch is covered, by controls that target it
      # precisely rather than by banning variable argv:
      #   - no-shell-invocation-for-external-tools (.semgrep/go-security.yml)
      #     fails the build on exec.Command("sh"|"bash"|"zsh"|"cmd"|"powershell").
      #     No shell means shell metacharacters in a path are inert, which is the
      #     actual attack G204 approximates.
      #   - argv is a slice of separate strings, so no argument can become a
      #     second command.
      #   - no user-supplied operand is passed in an option position. internal/git
      #     builds a fixed argv and puts the only variable — the worktree path —
      #     after `-C`, where git reads it as a value and not as a flag. A command
      #     that ever takes a user-supplied *operand* (a URL, a ref) must
      #     terminate option parsing with `--` before it, and pin that with a test.
      #
      # Scoped to the packages that invoke tools, not repo-wide.
      #
      # The scope was `internal/project/` until #8, naming a clone-by-URL path
      # that was never built — the package shells out to nothing, and the test
      # this note used to cite as the `--` pin does not exist. #8 is the first
      # real external-binary caller, so the scope now names the package that
      # actually has one, and the claim above is written against code that is
      # in the tree.
      #
      # #10 adds internal/kubeexec and internal/tools, and each satisfies the
      # three controls above by construction rather than by review:
      #   - internal/kubeexec builds its argv in exactly one function
      #     (Binding.argv), which puts the only user-supplied values — the
      #     context and the namespace — inside `--context=` and `--namespace=`.
      #     A value beginning with a dash therefore cannot become a flag, which
      #     is the operand risk the third control names, and there is a test
      #     pinning it (TestLeadingDashesStayValues).
      #   - internal/tools passes no user input at all. Its argv is three
      #     constant `--version` invocations from a package-level table; the
      #     only variable is the path exec.LookPath resolved, which is the
      #     lookup gosec would recommend doing.
      #
      # #53 replaces internal/git in this list with internal/gitexec, and that
      # is a narrowing rather than a move. It is the same exec call, still
      # building a fixed argv with the worktree path after `-C` — but it is now
      # the only one, and internal/git starts no process at all, so the
      # exclusion no longer covers a package that does not need it. The git
      # fixture builders that do exec are in _test.go files, which this rule
      # already names.
      - path: (internal/gitexec/|internal/kubeexec/|internal/tools/|_test\.go)
        linters:
          - gosec
        text: "G204"

issues:
  max-issues-per-linter: 50
  max-same-issues: 10

formatters:
  enable:
    - gofmt
    - goimports
    - gofumpt
  settings:
    goimports:
      local-prefixes:
        - github.com/txn2/m6t
  exclusions:
    generated: lax
    paths:
      - frontend/node_modules
